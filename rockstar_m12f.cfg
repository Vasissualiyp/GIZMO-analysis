# Rockstar configuration for m12f FIRE-3 cosmological zoom-in
# Snapshot 270, z~21 (a~0.045)
# Single-snapshot, single-CPU mode for initial test

# File format: GIZMO HDF5 (reads PartType1 = DM)
FILE_FORMAT = "GIZMO"

# Unit conversions: GIZMO native units -> Rockstar internal units
# GIZMO: positions in comoving kpc/h, masses in 1e10 Msun/h
# Rockstar: positions in comoving Mpc/h, masses in Msun/h
GIZMO_LENGTH_CONVERSION = 1e-3    # kpc/h -> Mpc/h
GIZMO_MASS_CONVERSION = 1e10      # 1e10 Msun/h -> Msun/h

# Cosmology (will be overridden by snapshot header, but set defaults)
# m12f at z~21: a ~ 0.045
SCALE_NOW = 0.045
h0 = 0.702
Ol = 0.69
Om = 0.31

# Force resolution of the simulation in Mpc/h (comoving)
# FIRE zoom-in DM softening ~ 40 pc/h physical at this redshift
# = 40e-3 kpc/h * (1+z) comoving ~ 0.88 kpc/h comoving = 8.8e-4 Mpc/h
FORCE_RES = 0.001

# Minimum number of particles per halo
MIN_HALO_PARTICLES = 20

# Particle mass override (0 = read from snapshot)
PARTICLE_MASS = 0

# Output
OUTBASE = "/scratch/vasissua/SHIVAN/rockstar_output"
